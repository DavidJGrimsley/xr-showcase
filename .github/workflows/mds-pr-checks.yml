name: MDS PR Checks

on:
  pull_request:
    branches: [test, main, phase-2-arena, arena-cpu-opponent]
  push:
    branches: [test]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify project
        run: npm run ci:verify --if-present
